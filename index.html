<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTQJRRP6SS"></script>
    <script src="/gtag-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: vite-plugin-pwa injects the manifest link + SW registration
         automatically at build time (see vite.config.ts). These extra tags
         cover what the manifest alone doesn't: Safari/iOS doesn't read
         start_url/display from the manifest for "Add to Home Screen", and
         theme-color needs to be in the document head directly. -->
    <meta name="theme-color" content="#1A1712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChatSched" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Per-route canonical URLs are emitted by src/components/Seo.tsx. -->

    <title>Tender &amp; RFQ Help for SA Small Businesses | ChatSched</title>
    <meta name="description" content="Find tenders and RFQs, get your compliance sorted and submit clean applications. Practical help for South African small businesses." />

    <!-- Open Graph / social previews. og-image.png now exists at
         /public/og-image.png (generated by scripts/generate_og_image.py —
         swap for a properly designed version whenever there's time). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChatSched" />
    <meta property="og:title" content="Tender &amp; RFQ Help for SA Small Businesses | ChatSched" />
    <meta property="og:description" content="Find tenders and RFQs, get your compliance sorted and submit clean applications. Practical help for South African small businesses." />
    <meta property="og:url" content="https://chatsched.com/" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:image" content="https://chatsched.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tender &amp; RFQ Help for SA Small Businesses | ChatSched" />
    <meta name="twitter:description" content="Find tenders and RFQs, get your compliance sorted and submit clean applications. Practical help for South African small businesses." />
    <meta name="twitter:image" content="https://chatsched.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ChatSched",
        "url": "https://chatsched.com/",
        "email": "info@chatsched.com",
        "telephone": "+27 60 897 3472",
        "description": "ChatSched helps South African small businesses find tenders and RFQs, get their compliance sorted and submit clean applications. Regulated work is done by independent, qualified partners.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Century Boulevard, Century City Dr",
          "addressLocality": "Century City, Cape Town",
          "postalCode": "7441",
          "addressCountry": "ZA"
        },
        "areaServed": {
          "@type": "Country",
          "name": "South Africa"
        },
        "sameAs": [
          "https://za.pinterest.com/chatsched/",
          "https://facebook.com/chatsched",
          "https://www.tiktok.com/@chatsched",
          "https://www.youtube.com/@chatsched",
          "https://www.linkedin.com/company/chatsched/",
          "https://www.instagram.com/chatsched/"
        ]
      }
    </script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a fallback font, then swaps). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" id="app-fonts" media="print" />
    <script src="/fonts-init.js" defer></script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" /></noscript>
  </head>
